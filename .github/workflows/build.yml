name: Fear Launcher - Build APK

# Kab trigger hoga workflow
on:
  push:
    branches: [ main, master ]      # Jab main/master branch me push karo
  pull_request:
    branches: [ main, master ]      # Jab PR banao
  workflow_dispatch:                 # Manual trigger bhi (Actions tab se)

jobs:
  build:
    runs-on: ubuntu-latest           # GitHub ka Ubuntu runner

    steps:
      # 1. Code ko checkout karo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 setup karo (Gradle 8.10 ke liye required)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'     # Eclipse Temurin JDK
          java-version: 17

      # 3. gradlew ko executable banao
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Debug APK build karo
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. APK ko artifact ke roop me upload karo
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30          # 30 din tak rahega artifact
