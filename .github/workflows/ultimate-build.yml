name: 🎯 SIMPLE - Just Show Error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build and show error
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          # Agar fail hua to yahi rukega
