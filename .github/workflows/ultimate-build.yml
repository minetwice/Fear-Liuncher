name: 🚀 Ultimate Fear Launcher Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: 📂 Debug - Check structure
      run: |
        echo "=== Checking project structure ==="
        ls -la
        echo "=== Checking gradle wrapper ==="
        ls -la gradle/wrapper/ || echo "WARNING: No gradle/wrapper folder"
        echo "=== Checking app source ==="
        ls -la app/src/main/ || echo "WARNING: No app source"
        ls -la app/src/main/java/com/fear/launcher/ 2>/dev/null || echo "WARNING: Java files missing"
        echo "=== Checking manifest ==="
        cat app/src/main/AndroidManifest.xml 2>/dev/null || echo "WARNING: No manifest"
    
    - name: 🔧 Fix permissions
      run: chmod +x gradlew
    
    - name: 🛠️ Clean build first
      run: ./gradlew clean --no-daemon
    
    - name: 🏗️ Build Debug APK
      id: build
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace
        echo "status=success" >> $GITHUB_OUTPUT
      continue-on-error: true
    
    - name: 📂 Find APK anywhere
      id: find-apk
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        
        # Create output directory if not exists
        mkdir -p app/build/outputs/apk/debug/
        
        # Try to find and copy APK to standard location
        APK_FILE=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "apk_exists=true" >> $GITHUB_OUTPUT
        else
          echo "apk_exists=false" >> $GITHUB_OUTPUT
          echo "No APK found in entire project"
        fi
        
        echo "=== Build output directories ==="
        ls -la app/build/outputs/ 2>/dev/null || echo "No outputs folder"
    
    - name: 📦 Upload APK (if exists)
      if: steps.find-apk.outputs.apk_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: FearLauncher-APK-Final
        path: |
          **/*.apk
          !**/*-unaligned.apk
        compression-level: 0
        retention-days: 90
    
    - name: ⚠️ Upload build logs (if build failed)
      if: steps.build.outcome == 'failure' || steps.find-apk.outputs.apk_exists == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          **/build/reports/
          **/build/outputs/logs/
          **/.gradle/
        retention-days: 7
    
    - name: ❌ Show error details
      if: steps.build.outcome == 'failure'
      run: |
        echo "Build failed! Check logs above."
        echo "Common fixes:"
        echo "1. Check AndroidManifest.xml exists at app/src/main/"
        echo "2. Check Java files exist at app/src/main/java/com/fear/launcher/"
        echo "3. Check compileSdk version (34 requires SDK installed)"
        exit 1
